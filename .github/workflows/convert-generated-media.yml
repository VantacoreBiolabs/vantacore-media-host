name: Convert generated PNG media to JPEG

on:
  push:
    paths:
      - 'source-images/*.png'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Convert source PNG files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          out = Path("posts")
          out.mkdir(exist_ok=True)
          for src in Path("source-images").glob("*.png"):
              dst = out / (src.stem + ".jpg")
              with Image.open(src) as im:
                  im.convert("RGB").save(dst, "JPEG", quality=94, subsampling=0)
          PY
      - name: Commit JPEG outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/*.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Convert generated PNG media to JPEG"
          git push
