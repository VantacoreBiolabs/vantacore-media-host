<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vantacore Media Uploader</title><style>:root{color-scheme:dark}body{font-family:Arial,sans-serif;background:#080808;color:#eee;max-width:650px;margin:35px auto;padding:20px}main{background:#131313;padding:26px;border-radius:18px;border:1px solid #3b2023}h1{margin-top:0}h1 span{color:#e4202b}input,button{width:100%;box-sizing:border-box;padding:14px;margin:8px 0;font-size:16px}button{background:#c51e28;color:white;border:0;border-radius:9px;font-weight:700}.out{margin-top:16px;padding:14px;background:#080808;border-radius:9px;word-break:break-all}a{color:#ff6871}</style></head><body><main><h1>VANTACORE <span>MEDIA UPLOADER</span></h1><p>Select an image. It uploads directly to Cloudinary and returns a public JPEG URL for Instagram.</p><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><button id="go">Upload Image</button><div id="out" class="out">Ready.</div></main><script>
const cloud="rqdfpzqb",preset="Vantacore_ig";document.getElementById("go").onclick=async()=>{const f=document.getElementById("file").files[0],o=document.getElementById("out");if(!f){o.textContent="Choose an image first.";return}o.textContent="Uploading…";const d=new FormData();d.append("file",f);d.append("upload_preset",preset);d.append("folder","vantacore_ig");try{const r=await fetch("https://api.cloudinary.com/v1_1/"+cloud+"/image/upload",{method:"POST",body:d});const j=await r.json();if(!r.ok)throw new Error(j.error?.message||"Upload failed");const u="https://res.cloudinary.com/"+cloud+"/image/upload/f_jpg,q_auto/"+j.public_id+".jpg";o.innerHTML='Upload complete.<br><a target="_blank" href="'+u+'">'+u+'</a><br><button id="copy">Copy URL</button>';document.getElementById("copy").onclick=()=>navigator.clipboard.writeText(u)}catch(e){o.textContent="Error: "+e.message}};</script></body></html>
