<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vantacore Media Host</title>
<style>
:root{color-scheme:dark;--red:#e4202b;--black:#070707;--panel:#121212;--white:#f7f7f7;--muted:#a8a8a8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#361014 0,#111 38%,#050505 78%);font-family:Arial,Helvetica,sans-serif;color:var(--white)}
main{width:min(92vw,760px);padding:42px;border:1px solid #382024;border-radius:24px;background:linear-gradient(145deg,rgba(25,25,25,.97),rgba(8,8,8,.98));box-shadow:0 22px 70px #000,0 0 42px rgba(228,32,43,.13)}
.badge{display:inline-block;padding:7px 12px;border:1px solid var(--red);border-radius:999px;color:#ff5962;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
h1{font-size:clamp(34px,7vw,66px);line-height:.94;margin:24px 0 16px;letter-spacing:-.05em}h1 span{color:var(--red)}
p{color:var(--muted);line-height:1.65;font-size:17px}.status{display:flex;align-items:center;gap:10px;margin-top:28px;font-weight:700;color:#ddd}.dot{width:11px;height:11px;border-radius:50%;background:#2bd576;box-shadow:0 0 16px #2bd576}
code{display:block;margin-top:24px;padding:16px;border-radius:12px;background:#050505;border:1px solid #242424;color:#ddd;overflow-wrap:anywhere;line-height:1.5}
footer{margin-top:30px;padding-top:20px;border-top:1px solid #242424;color:#777;font-size:13px}
</style>
</head>
<body><main>
<div class="badge">Vantacore Biolabs</div>
<h1>MEDIA <span>HOST</span></h1>
<p>Permanent public media storage for the Vantacore Biolabs Instagram publishing system.</p>
<div class="status"><span class="dot"></span> Repository active</div>
<code>raw.githubusercontent.com/VantacoreBiolabs/vantacore-media-host/main/media/FILENAME.jpg</code>
<footer>Vantacore Biolabs · Public-ready media only</footer>
</main></body></html>
